name: Deploy static site

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node for the standalone artifact checker
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the verified CI artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: production-artifact

      # To retry publication, re-run the successful CI workflow so this job
      # receives a fresh workflow_run event tied to the same checked artifact.
      - name: Verify the exact downloaded artifact
        run: node scripts/check-production-artifact.mjs production-artifact/dist production-artifact/artifact-manifest.json ${{ github.event.workflow_run.head_sha }}

      - name: Publish the verified artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy production-artifact/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --commit-dirty=true
